name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @iq/shared build
      - run: pnpm --filter @iq/shared test
      - run: pnpm --filter @iq/api test
      - run: pnpm --filter @iq/shared lint
      - run: pnpm --filter @iq/api lint
