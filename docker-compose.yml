services:
  postgres:
    image: postgres:16-alpine
    container_name: iq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: iq
      POSTGRES_PASSWORD: iqsecret
      POSTGRES_DB: iq_inventory
    ports:
      - "5432:5432"
    volumes:
      - iq_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iq -d iq_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  iq_pg_data:
